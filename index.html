<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EduDebt.AI – Education Loan Planner</title>
  <style>
    :root {
      --p: #4338ca;
      --pl: #eef0ff;
      --bg: #f8fafc;
      --tx: #0f172a;
      --mu: #64748b;
      --bd: #e2e8f0;
      --g: #059669;
      --gl: #d1fae5;
      --r: #dc2626;
      --navy: #1e1b4b
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--tx);
      line-height: 1.45
    }

    button,
    input,
    select {
      font: inherit
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -.02em
    }

    h2 {
      font-size: 1.4rem;
      font-weight: 700
    }

    h3 {
      font-size: 1.1rem;
      font-weight: 700
    }

    .mu {
      color: var(--mu)
    }

    .sm {
      font-size: .85rem
    }

    .c {
      text-align: center
    }

    a {
      cursor: pointer;
      color: var(--p);
      font-weight: 600
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px
    }

    .top {
      background: #fff;
      border-bottom: 1px solid var(--bd);
      position: sticky;
      top: 0;
      z-index: 20
    }

    .top>div {
      max-width: 1240px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap
    }

    .lg {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.25rem
    }

    .lg b {
      color: var(--p)
    }

    .lnk {
      display: flex;
      gap: 28px;
      color: var(--mu);
      font-size: .92rem
    }

    .lnk a {
      color: var(--mu);
      font-weight: 500
    }

    .btn,
    .btn2 {
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: var(--p);
      transition: .15s
    }

    .btn:hover {
      background: #3730a3
    }

    .btn2 {
      background: var(--pl);
      color: var(--p)
    }

    .btn2:hover {
      background: #dfe3ff
    }

    .btn:focus-visible,
    .btn2:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 3px solid #a5b4fc;
      outline-offset: 2px
    }

    .w {
      width: 100%;
      margin: 6px 0
    }

    .big {
      padding: 15px;
      width: 100%
    }

    .danger {
      background: #fee2e2;
      color: var(--r)
    }

    .card {
      background: #fff;
      border: 1px solid var(--bd);
      border-radius: 18px;
      padding: 24px
    }

    .pill {
      display: inline-block;
      background: var(--pl);
      color: var(--p);
      font-size: .75rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px
    }

    .pill.g {
      background: var(--gl);
      color: var(--g)
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 40px;
      align-items: center;
      padding-top: 60px;
      padding-bottom: 30px
    }

    .hero p.mu {
      margin: 22px 0;
      font-size: 1.1rem;
      max-width: 34em
    }

    .row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin: 10px 0
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 14px;
      height: 220px;
      margin-top: 20px
    }

    .bars i {
      flex: 1;
      background: var(--p);
      border-radius: 6px 6px 0 0
    }

    .bars i:last-child {
      background: #059669
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 40px 24px
    }

    .stats b {
      display: block;
      font-size: 2rem;
      color: var(--p)
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin: 30px 0 70px
    }

    .steps b.n {
      color: var(--p);
      font-size: 1.2rem
    }

    .dark {
      background: var(--navy);
      border-radius: 28px;
      padding: 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: center;
      color: #fff;
      margin-bottom: 60px
    }

    .dark h2 {
      font-size: 2.2rem
    }

    .dark .card {
      color: var(--tx)
    }

    .foot {
      border-top: 1px solid var(--bd);
      background: #fff;
      padding: 34px 24px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 14px;
      color: var(--mu);
      font-size: .82rem
    }

    .two {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 40px;
      padding-top: 50px;
      padding-bottom: 60px;
      align-items: start
    }

    .g3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-top: 20px
    }

    .g3 .card {
      padding: 18px
    }

    .g3 b {
      display: block;
      font-size: 1.5rem;
      color: var(--p)
    }

    .tabs {
      display: flex;
      background: var(--pl);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 22px
    }

    .tabs button {
      flex: 1;
      border: 0;
      background: none;
      padding: 11px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      color: var(--mu)
    }

    .tabs button.on {
      background: #fff;
      color: var(--tx);
      box-shadow: 0 1px 3px #0002
    }

    label.l {
      display: block;
      font-weight: 600;
      font-size: .85rem;
      margin: 14px 0 6px
    }

    .in {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--bd);
      border-radius: 12px;
      background: #f8fafc
    }

    .err {
      color: var(--r);
      font-size: .88rem;
      min-height: 1.3em;
      margin: 8px 0
    }

    .auth .btn2 {
      display: flex;
      justify-content: center;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--bd);
      background: #f8fafc;
      color: var(--tx);
      border-radius: 12px
    }

    .pb {
      height: 10px;
      border-radius: 9px;
      background: #e2e8f0;
      margin: 18px 0;
      overflow: hidden
    }

    .pb i {
      display: block;
      height: 100%;
      background: var(--p);
      border-radius: 9px
    }

    .steps3 {
      display: flex;
      gap: 40px;
      padding: 22px 0;
      color: var(--mu);
      font-size: .9rem;
      flex-wrap: wrap
    }

    .steps3 .on {
      color: var(--p);
      font-weight: 700
    }

    .split {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 28px;
      align-items: start
    }

    .opts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 16px
    }

    .opt {
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 22px 18px;
      cursor: pointer;
      background: #fff;
      font-weight: 600;
      text-align: left;
      min-height: 84px
    }

    .opt.on {
      background: var(--pl);
      border-color: var(--p);
      color: var(--p)
    }

    .chips {
      display: grid;
      gap: 8px;
      margin-top: 14px;
      max-width: 520px
    }

    .chip {
      border: 0;
      text-align: left;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--pl);
      font-weight: 600;
      cursor: pointer
    }

    .chip.on {
      background: var(--p);
      color: #fff
    }

    .kp {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 16px
    }

    .k {
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 16px;
      background: #fff
    }

    .k small {
      color: var(--mu);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase
    }

    .k b {
      display: block;
      font-size: 1.6rem;
      margin-top: 4px
    }

    .gr {
      color: var(--g)
    }

    .pu {
      color: var(--p)
    }

    .rd {
      color: var(--r)
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--p)
    }

    .drop {
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      padding: 20px 10px;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      background: #f8fafc
    }

    .drop.hv {
      border-color: var(--p);
      background: var(--pl)
    }

    .f2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 18px
    }

    .banner {
      padding: 14px 16px;
      border-radius: 12px;
      margin-top: 16px;
      font-weight: 600;
      font-size: .92rem
    }

    .banner.b {
      background: var(--pl)
    }

    .banner.gn {
      background: var(--gl);
      color: var(--g)
    }

    .banner.y {
      background: #fef3c7;
      color: #92400e;
      font-weight: 500
    }

    .acts {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin: 26px 0;
      flex-wrap: wrap
    }

    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh
    }

    .side {
      background: #fff;
      border-right: 1px solid var(--bd);
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: sticky;
      top: 0;
      height: 100vh
    }

    .side a.nv {
      display: block;
      padding: 13px 18px;
      border-radius: 12px;
      color: var(--tx);
      font-weight: 600;
      margin-top: 4px
    }

    .side a.nv.on {
      background: var(--p);
      color: #fff
    }

    .side a.nv:not(.on):hover {
      background: var(--pl)
    }

    .lc {
      margin-top: auto;
      background: var(--pl);
      border-radius: 16px;
      padding: 16px
    }

    .lc b {
      font-size: 1.6rem;
      display: block
    }

    .main {
      min-width: 0
    }

    .tb {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      background: #fff;
      border-bottom: 1px solid var(--bd);
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 10
    }

    .tb .sp {
      flex: 1
    }

    .ham {
      display: none;
      border: 0;
      background: var(--pl);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 1.2rem;
      cursor: pointer
    }

    .av {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #bfdbfe;
      border: 0;
      cursor: pointer;
      font-weight: 800;
      color: #1d4ed8;
      position: relative
    }

    .menu {
      position: absolute;
      right: 28px;
      top: 62px;
      background: #fff;
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 8px;
      display: none;
      box-shadow: 0 8px 24px #0002;
      z-index: 30
    }

    .menu.on {
      display: block
    }

    .pg {
      padding: 26px 28px 60px
    }

    .hb {
      background: var(--p);
      color: #fff;
      border-radius: 22px;
      padding: 34px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap
    }

    .hb p {
      opacity: .9;
      max-width: 640px;
      margin-top: 10px
    }

    .hb .btn {
      background: #fff;
      color: var(--p)
    }

    .kg {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      margin: 22px 0
    }

    .dg {
      display: grid;
      grid-template-columns: 1.9fr 1fr;
      gap: 22px
    }

    .cb {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      height: 230px;
      margin-top: 20px
    }

    .cb i {
      flex: 1;
      background: var(--p);
      border-radius: 6px 6px 0 0;
      position: relative
    }

    .cb i:last-child {
      background: var(--g)
    }

    .cb i:hover::after {
      content: attr(data-t);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: .7rem;
      white-space: nowrap
    }

    .sg {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 14px
    }

    .sg .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: space-between
    }

    .ai {
      background: var(--pl);
      border-radius: 12px;
      padding: 14px;
      margin: 14px 0;
      font-size: .92rem;
      min-height: 84px
    }

    .cs {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: calc(100vh - 69px)
    }

    .hist {
      background: #dde6f1;
      padding: 16px;
      overflow: auto
    }

    .hist .it {
      display: block;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: .92rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .hist .it:hover,
    .hist .it.on {
      background: #fff8
    }

    .chat {
      display: flex;
      flex-direction: column;
      min-width: 0
    }

    .msgs {
      flex: 1;
      overflow: auto;
      padding: 22px 26px;
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .m {
      max-width: 760px;
      border-radius: 18px;
      padding: 16px 20px
    }

    .m.u {
      background: #111827;
      color: #fff;
      align-self: flex-end
    }

    .m.a {
      background: #fff;
      border: 1px solid var(--bd);
      align-self: flex-start
    }

    .m .g3 {
      margin: 14px 0 6px
    }

    .tip {
      background: var(--pl);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 10px;
      font-size: .9rem
    }

    .cin {
      display: flex;
      gap: 10px;
      padding: 14px 26px 22px
    }

    .cin input {
      flex: 1;
      border-radius: 999px;
      padding: 14px 20px;
      border: 1px solid var(--bd)
    }

    .sug {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px
    }

    table.t {
      width: 100%;
      border-collapse: collapse
    }

    .t td,
    .t th {
      padding: 20px 18px;
      text-align: left
    }

    .t th {
      font-size: .72rem;
      color: var(--mu);
      text-transform: uppercase;
      letter-spacing: .04em
    }

    .t td:nth-child(3),
    .t th:nth-child(3) {
      background: var(--pl);
      color: var(--p);
      font-weight: 700
    }

    .t td:nth-child(2) {
      font-weight: 700;
      font-size: 1.1rem
    }

    .t td:nth-child(3) {
      font-size: 1.1rem
    }

    .ov {
      overflow-x: auto
    }

    .sw {
      position: relative;
      width: 52px;
      height: 28px;
      display: inline-block;
      flex: none
    }

    .sw input {
      opacity: 0;
      width: 0;
      height: 0
    }

    .sw span {
      position: absolute;
      inset: 0;
      background: #e2e8f0;
      border-radius: 99px;
      cursor: pointer;
      transition: .2s
    }

    .sw span::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: .2s
    }

    .sw input:checked+span {
      background: var(--p)
    }

    .sw input:checked+span::before {
      transform: translateX(24px)
    }

    .sw input:focus-visible+span {
      outline: 3px solid #a5b4fc
    }

    .tr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      font-weight: 600
    }

    .sgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      margin-top: 20px;
      align-items: start
    }

    .mo {
      position: fixed;
      inset: 0;
      background: #0f172a99;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px
    }

    .mo>div {
      background: #fff;
      border-radius: 20px;
      padding: 28px;
      max-width: 480px;
      width: 100%;
      max-height: 90vh;
      overflow: auto
    }

    .mo h3 {
      margin-bottom: 10px
    }

    .mo p {
      margin: 8px 0
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 12px 22px;
      border-radius: 999px;
      z-index: 200;
      font-size: .92rem;
      max-width: 90vw
    }

    @media(max-width:960px) {

      .hero,
      .two,
      .dark,
      .split,
      .dg,
      .sgrid {
        grid-template-columns: 1fr
      }

      .lnk {
        display: none
      }

      .app {
        grid-template-columns: 1fr
      }

      .side {
        position: fixed;
        left: -290px;
        width: 270px;
        z-index: 50;
        transition: .25s;
        box-shadow: 0 0 30px #0004
      }

      .side.open {
        left: 0
      }

      .ham {
        display: block
      }

      .cs {
        grid-template-columns: 1fr;
        height: auto
      }

      .hist {
        display: flex;
        gap: 8px;
        overflow: auto;
        padding: 10px
      }

      .hist .it {
        flex: none;
        max-width: 200px
      }

      .chat {
        height: 75vh
      }
    }

    @media(max-width:560px) {

      .opts,
      .f2,
      .kp {
        grid-template-columns: 1fr
      }

      .pg {
        padding: 18px 14px
      }

      .dark {
        padding: 24px
      }

      .t td,
      .t th {
        padding: 12px 8px;
        font-size: .85rem
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script>
    /* ===== helpers & data ===== */
    const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
    let DB = JSON.parse(localStorage.getItem('edudebt') || '{"users":{},"cur":null}');
    const save = () => localStorage.setItem('edudebt', JSON.stringify(DB));
    const U = () => DB.users[DB.cur];
    const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
    const mon = n => (U() && U().tg.mask) ? '₹ ••••••' : inr(n);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const emi = (P, r, n) => { const i = r / 1200; return i ? P * i / (1 - Math.pow(1 + i, -n)) : P / n };
    const sim = (P, r, e, x = 0) => { const i = r / 1200; let b = P, m = 0, t = 0; while (b > 0.5) { const it = b * i; if (e + x <= it + .01) return { m: 999, int: Infinity }; t += it; b += it - e - x; if (++m > 999) break } return { m, int: t } };
    const addM = m => { const d = new Date(); d.setMonth(d.getMonth() + m); return d.toLocaleString('en-IN', { month: 'short', year: 'numeric' }) };
    const draft = () => JSON.parse(sessionStorage.getItem('draft') || '{}');
    const FOCUS = ['Active Loan Repayment & Optimization', 'Moratorium / In-College Planning', 'Upcoming Graduation & Job Transition', 'Parent / Co-Borrower Guidance'];
    const STAGE = ['Undergrad / Postgrad', 'Final-Year Student', 'Early Career (0–3 Yrs)', 'Abroad Study / MS Candidate'];
    const PRIO = ['Become 100% Debt-Free 2–3 Years Early', 'Maximize Section 80E Tax Deduction', 'Keep Monthly EMI Minimum for Flexibility', 'Refinance at Lower Interest Rate'];
    const PSH = ['Fast-Track Payoff', '80E Tax Max', 'Low-EMI Flexibility', 'Refinance Focus'];
    let page = 'landing', authTab = 'login', curChat = -1, scX = 3000;

    function nums(t) { return [...t.replace(/\d+(\.\d+)?\s*%/g, ' ').matchAll(/(\d[\d,]*(?:\.\d+)?)\s*(k|lakh|lakhs|lac|l|cr)?\b/gi)].map(m => { let v = parseFloat(m[1].replace(/,/g, '')); const s = (m[2] || '').toLowerCase(); if (s === 'k') v *= 1e3; else if (/^(lakh|lakhs|lac|l)$/.test(s)) v *= 1e5; else if (s === 'cr') v *= 1e7; return v }).filter(v => v > 0) }
    function answer(q) {
      const c = ctx(), u = c.u, l = c.l, t = q.toLowerCase(), n = nums(t), e = c.e, x0 = c.x, base = c.cur;
      const R = h => ({ h });
      if (/80e|tax|rebate|deduct/.test(t)) { const y = yearInt(l.bal, l.rate, e + x0); return R(`<p><b>Section 80E</b> allows a deduction for the <b>interest</b> paid on an education loan (principal does not qualify), with no upper limit, for up to 8 years from when repayment starts or until the interest is cleared, whichever is earlier.</p>${card3([['Interest, next 12 mo', inr(y), 'on your loan'], ['Tax saved at 30% slab', inr(y * .3), 'illustrative'], ['Tax saved at 20% slab', inr(y * .2), 'illustrative']])}<div class=tip>Prepaying lowers interest, so your 80E deduction shrinks too — but you still come out ahead because every ₹1 of interest avoided costs less than the tax saved on it. Confirm the current section number and regime with a tax professional.</div>`) }

      if (/refinanc|balance transfer|switch|lower rate|credila|hdfc/.test(t)) {
        const m = q.match(/(\d+(?:\.\d+)?)\s*%/), nr = m ? +m[1] : Math.max(l.rate - 1, 1), rem = Math.min(base.m, 600), ne = emi(l.bal, nr, rem), sv = base.int - (ne * rem - l.bal);
        return R(`<p>Moving the current balance of ${mon(l.bal)} from ${l.rate}% to <b>${nr}%</b> over the same ${rem} remaining months:</p>${card3([['New EMI', inr(ne), 'was ' + inr(e + x0)], ['Interest saved', inr(sv), 'before fees', sv > 0 ? 'gr' : 'rd'], ['Break-even', sv > 0 ? 'Check fees' : 'No gain', '']])}<div class=tip>Subtract processing fees (often 0.5–1% of the amount) and any lost moratorium/subsidy benefits. If savings exceed fees comfortably, refinancing is worth a quote.</div>`)
      }
      if (/extra|prepay|prepayment|pay more|more every|bonus|lump|increase|boost|pay off|payoff|part.?pay|surplus|first salary/.test(t) || (/pay/.test(t) && n.length && /month|once|extra/.test(t))) {
        let a = n.find(v => v < l.bal * 1.01 && v >= 100) || 3000; const lump = /lump|one[- ]?time|bonus|once|joining|diwali/.test(t) || a >= 60000, assume = n.length ? '' : ' (no amount given, so I assumed ₹3,000)';
        if (lump) { const s = sim(Math.max(l.bal - a, 0), l.rate, e, x0); return R(`<p>A one-time prepayment of <b>${inr(a)}</b> toward principal${assume}:</p>${card3([['One-time payment', inr(a), 'to principal'], ['Debt-free date', s.m ? addM(s.m) : 'Now', Math.max(base.m - s.m, 0) + ' months sooner', 'gr'], ['Interest saved', inr(base.int - s.int), 'pure saving', 'pu']])}<div class=tip>Ask your lender to apply it as a <b>principal prepayment that reduces tenure</b> rather than advance-EMI buffering. Floating-rate loans to individuals usually have no prepayment penalty — confirm with your bank.</div>`) }
        const s = sim(l.bal, l.rate, e, x0 + a); return R(`<p>Paying <b>${inr(a)}</b> extra every month${assume} at ${l.rate}%:</p>${card3([['Monthly payment', inr(e + x0 + a), '+' + inr(a) + '/mo'], ['Debt-free date', s.m >= 999 ? '—' : addM(s.m), (base.m - s.m) + ' months faster', 'gr'], ['Interest saved', inr(base.int - s.int), 'pure cash saved', 'pu']])}<div class=tip>Calculated on a monthly reducing balance. Select "Principal Prepayment" when depositing the extra amount, and keep an emergency buffer before committing.</div>`)

    }
    function saveSc() { const u = U(), a = sim(u.loan.bal, u.loan.rate, ctx().e, scX); u.saved.unshift({ x: scX, m: a.m }); u.saved = u.saved.slice(0, 8); save(); drawSaved(); toast('Scenario saved') }
    function drawSaved() { const u = U(), c = ctx(); $('#saved').innerHTML = u.saved.length ? `<div class=card><h3>Saved scenarios</h3>${u.saved.map((s, i) => { const r = sim(u.loan.bal, u.loan.rate, c.e, s.x); return `<div class=tr><span>${inr(s.x)}/mo extra → ${r.m >= 999 ? '—' : addM(r.m)} • saves ${inr(c.base.int - r.int)}</span><span><button class=btn2 onclick="setSc(${s.x})">Load</button> <button class="btn2 danger" onclick="delSc(${i})">Delete</button></span></div>` }).join('')}</div>` : '' }
    function delSc(i) { U().saved.splice(i, 1); save(); drawSaved() }
    function applySc() { const u = U(); u.extra = scX; save(); toast('Strategy applied to your repayment schedule'); go('dash') }

    /* ===== SETTINGS ===== */
    function tg(k, v) { U().tg[k] = v ? 1 : 0; save(); if (k === 'mask') render(); else toast('Preference updated') }
    function saveProfile() { const u = U(), n = $('#s_nm').value.trim(); if (n.length < 2) return toast('Enter your name'); u.name = n; u.college = $('#s_co').value.trim(); u.income = Math.max(+$('#s_inc').value || 0, 0); u.employer = $('#s_emp').value.trim(); save(); toast('Saved'); render() }
    function schedule() { const c = ctx(), i = c.l.rate / 1200; let b = c.l.bal, rows = [], d = new Date(); for (let m = 1; b > 0.5 && m <= 600; m++) { const it = b * i, pay = Math.min(c.e + c.x, b + it), pr = pay - it; b = Math.max(b - pr, 0); d.setMonth(d.getMonth() + 1); rows.push([m, d.toLocaleString('en-IN', { month: 'short', year: 'numeric' }), Math.round(pay), Math.round(it), Math.round(pr), Math.round(b)]) } return rows }
    function exportModal() { modal(`<h3>Export loan history</h3><p class=mu>Your repayment schedule from today at the current plan.</p><br><button class=btn onclick="expCsv()">Download CSV</button> <button class=btn2 onclick="expPdf()">Save as PDF</button>`) }
    function expCsv() { const r = [['Month', 'Date', 'Payment', 'Interest', 'Principal', 'Balance'], ...schedule()].map(a => a.join(',')).join('\n'), a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([r], { type: 'text/csv' })); a.download = 'edudebt-loan-schedule.csv'; a.click(); closeM(); toast('CSV downloaded') }
    function expPdf() { const w = window.open('', '_blank'); if (!w) return toast('Allow pop-ups to export PDF'); w.document.write('<title>Loan schedule</title><style>body{font-family:sans-serif}td,th{border:1px solid #ccc;padding:4px 8px;text-align:right}table{border-collapse:collapse}</style><h2>EduDebt.AI – Repayment schedule</h2><table><tr><th>Month</th><th>Date</th><th>Payment</th><th>Interest</th><th>Principal</th><th>Balance</th></tr>' + schedule().map(r => '<tr>' + r.map(v => '<td>' + v + '</td>').join('') + '</tr>').join('') + '</table>'); w.document.close(); w.print(); closeM() }
    function delModal() { modal(`<h3 style="color:var(--r)">Delete account</h3><p>This permanently removes your profile, loan data, chats and saved scenarios from this browser. This cannot be undone.</p><label class=l>Type DELETE to confirm</label><input id=dc class=in oninput="$('#db').disabled=this.value!=='DELETE'"><br><br><button id=db class="btn danger" disabled onclick="delAcc()" style="opacity:1">Delete my account</button> <button class=btn2 onclick="closeM()">Cancel</button>`) }
    function delAcc() { delete DB.users[DB.cur]; DB.cur = null; save(); sessionStorage.removeItem('draft'); closeM(); authTab = 'login'; page = 'landing'; render(); toast('Your account has been deleted') }

    document.addEventListener('click', e => { const m = $('#menu'); if (m && !e.target.closest('.av,.menu')) m.classList.remove('on') });
    if (U()) { page = U().loan ? 'dash' : (U().persona.done ? 'loan' : 'persona') }
    render();
  </script>
</body>

</html>
